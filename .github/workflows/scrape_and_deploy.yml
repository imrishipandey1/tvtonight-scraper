name: Scrape and Deploy

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

jobs:
  scrape_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python3 -m pip install Pillow

      # Set up SSH Key for native commands (like scp)
      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Download cache.db from VPS using the SSH key
      - name: Download cache.db from VPS
        run: |
          mkdir -p cache
          scp -o StrictHostKeyChecking=no -P 22 ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/data/tv/cache/logo_cache.db cache/logo_cache.db || echo "No existing cache found"

      # STEP 1: Run the Scraper Script
      - name: Run TitanTV Scraper
        run: python3 titantv_scraper.py

      # STEP 2: Run the Logo Downloader
      - name: Run Logo Downloader
        run: python3 logo_downloader.py || true

      # STEP 3: Compress outputs into tar.gz format
      - name: Compress Outputs
        run: |
          tar -czf schedule.tar.gz schedule/
          mkdir -p logos
          tar -czf logos.tar.gz logos/
          tar -czf cache.tar.gz cache/

      # STEP 4: Transfer compressed files to VPS using the SSH key
      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "schedule.tar.gz,logos.tar.gz,cache.tar.gz"
          target: "/tmp/tvtonight_deploy"

      # STEP 5: Uncompress files on the VPS using the SSH key
      - name: Extract files on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            sudo mkdir -p /data/tv/
            sudo tar -xzf /tmp/tvtonight_deploy/schedule.tar.gz -C /data/tv/
            sudo tar -xzf /tmp/tvtonight_deploy/logos.tar.gz -C /data/tv/
            sudo tar -xzf /tmp/tvtonight_deploy/cache.tar.gz -C /data/tv/
            if [ -d "/data/tv/schedule" ]; then
              sudo find /data/tv/schedule -type f -name "*.json" -mtime +7 -delete
              sudo find /data/tv/schedule -mindepth 1 -type d -empty -delete
            fi
            sudo find /data/tv -type d -exec chmod 755 {} +
            sudo find /data/tv -type f -exec chmod 644 {} +
            sudo rm -rf /tmp/tvtonight_deploy
